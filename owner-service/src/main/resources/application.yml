server:
  port: 8082

spring:
  application:
    name: owner-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: ${OWNER_DB_URL:jdbc:mysql://localhost:3307/owner_db}
    username: ${OWNER_DB_USERNAME:root}
    password: ${OWNER_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0   # owner-service 전용 DB 인덱스 (1=estimate)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.zzimple.common.event"
        spring.json.use.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Phase 4: auth-service 추출 완료 - url을 비워 Eureka(lb)로 전환
clients:
  auth-service:
    url: ${AUTH_SERVICE_URL:}

# 공공데이터 사업자 상태 조회 API 키 (Config Server/환경변수 주입)
api:
  serviceKey: ${BUSINESS_API_SERVICE_KEY:changeme}
