server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/users/**,/auth/**
        - id: integration-service
          uri: lb://integration-service
          predicates:
            - Path=/juso/**,/gpt/**,/kakao-navi/**
        - id: staff-service
          uri: lb://staff-service
          predicates:
            - Path=/staff/**,/owner/schedule/**
        # /owner/schedule/** 는 위 staff-service 라우트가 먼저 매칭된다 (선언 순서 중요)
        - id: owner-service
          uri: lb://owner-service
          predicates:
            - Path=/owner/**
        # strangler: 아직 추출되지 않은 나머지 경로는 legacy 모놀리스로 전달
        - id: legacy-monolith
          uri: ${LEGACY_MONOLITH_URL:http://localhost:8081}
          predicates:
            - Path=/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

jwt:
  # 게이트웨이는 JWT '검증'만 한다. 발급은 auth-service(현재는 legacy)만 수행.
  # 실제 키는 Config Server / 환경변수로 주입
  secret-key: ${JWT_SECRET_KEY:local-dev-secret-key-local-dev-secret-key}

gateway:
  # JWT 검증을 건너뛰는 공개 경로 (모놀리스 SecurityConfig의 permitAll 목록 승계, 콤마 구분)
  public-paths: /auth/**,/oauth2/**,/users/**,/owner/register,/owner/login-id-duplicate-check,/owner/business/**,/juso/**,/swagger-ui/**,/v3/api-docs/**
