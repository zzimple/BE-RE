# 찜플 MSA 로컬 오케스트레이션
# 단계적으로 서비스가 추가된다 (Phase 0: 인프라 3종만)
services:
  discovery-server:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  config-server:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: config-server
    environment:
      CONFIG_REPO_ROOT: /config-repo
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    volumes:
      - ./infra/config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    depends_on:
      - discovery-server

  gateway:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
      - config-server

  integration-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: integration-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
      - config-server

  mysql-staff:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: staff_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  staff-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: staff-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      STAFF_DB_URL: jdbc:mysql://mysql-staff:3306/staff_db
      LEGACY_MONOLITH_URL: http://legacy-monolith:8081
    depends_on:
      - discovery-server
      - config-server
      - mysql-staff

  # strangler 단계의 legacy 모놀리스 (미추출 도메인: user/owner/estimate)
  mysql-legacy:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zzimple
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  legacy-monolith:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: legacy-monolith
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-legacy:3306/zzimple
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-local-dev-secret-key}
      CLIENTS_STAFF_SERVICE_URL: http://staff-service:8083
    depends_on:
      - mysql-legacy
      - redis
