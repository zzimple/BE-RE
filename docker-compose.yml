# 찜플 MSA 로컬 오케스트레이션
# 인프라: discovery(Eureka)/config-server/gateway + Kafka(KRaft)/Redis/MySQL x4
# 서비스: auth/owner/staff/estimate/integration (외부 노출은 gateway:8080 뿐)
#
# 기동 순서는 healthcheck + depends_on(service_healthy)으로 보장된다:
#   MySQL/Redis/Kafka 준비 완료 -> discovery -> config-server -> 도메인 서비스 -> gateway
# Java 서비스 헬스체크는 이미지에 curl이 없어 bash TCP 체크(/dev/tcp)를 사용한다.

x-service-defaults: &service-defaults
  restart: on-failure

services:
  # ─────────────── 인프라 ───────────────
  discovery-server:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: discovery-server
    <<: *service-defaults
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8761' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  config-server:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: config-server
    <<: *service-defaults
    environment:
      CONFIG_REPO_ROOT: /config-repo
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
    volumes:
      - ./infra/config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8888' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: gateway
    <<: *service-defaults
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-local-dev-secret-key}
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: on-failure
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: zzimple-dev-cluster-01
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────── 데이터베이스 (서비스별 분리) ───────────────
  mysql-auth:
    image: mysql:8.0
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mysql-owner:
    image: mysql:8.0
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: owner_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mysql-staff:
    image: mysql:8.0
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: staff_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mysql-estimate:
    image: mysql:8.0
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: estimate_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────── 도메인 서비스 ───────────────
  auth-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: auth-service
    <<: *service-defaults
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      AUTH_DB_URL: jdbc:mysql://mysql-auth:3306/auth_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-local-dev-secret-key}
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy

  owner-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: owner-service
    <<: *service-defaults
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      OWNER_DB_URL: jdbc:mysql://mysql-owner:3306/owner_db
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BUSINESS_API_SERVICE_KEY: ${BUSINESS_API_SERVICE_KEY:-changeme}
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql-owner:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  staff-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: staff-service
    <<: *service-defaults
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      STAFF_DB_URL: jdbc:mysql://mysql-staff:3306/staff_db
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql-staff:
        condition: service_healthy

  estimate-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: estimate-service
    <<: *service-defaults
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      ESTIMATE_DB_URL: jdbc:mysql://mysql-estimate:3306/estimate_db
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql-estimate:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  integration-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE_MODULE: integration-service
    <<: *service-defaults
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-changeme}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-changeme}
      JUSO_FRONT_CALLBACK_URL: ${JUSO_FRONT_CALLBACK_URL:-http://localhost:3000/juso/callback}
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
