# staff-service 전용 설정
spring:
  datasource:
    url: ${STAFF_DB_URL:jdbc:mysql://mysql-staff:3306/staff_db}
    username: ${STAFF_DB_USERNAME:root}
    password: ${STAFF_DB_PASSWORD:root}

# 서비스 간 호출은 전부 Eureka 디스커버리 (url 비움)
clients:
  auth-service:
    # Phase 4: auth-service 추출 완료 - Eureka(lb)로 전환
    url: ""
  owner-service:
    # Phase 3: owner-service 추출 완료 - Eureka(lb)로 전환
    url: ""
  estimate-service:
    # Phase 5: estimate-service 추출 완료 - Eureka(lb)로 전환
    url: ""

