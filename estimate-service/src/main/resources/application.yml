server:
  port: 8086

spring:
  application:
    name: estimate-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: ${ESTIMATE_DB_URL:jdbc:mysql://localhost:3310/estimate_db}
    username: ${ESTIMATE_DB_USERNAME:root}
    password: ${ESTIMATE_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always   # item_type 시드(data.sql)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 1   # estimate-service 전용 DB 인덱스 (0=owner)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.zzimple.common.event"
        spring.json.use.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# 전부 Eureka 디스커버리 (url 비움)
clients:
  auth-service:
    url: ${AUTH_SERVICE_URL:}
  owner-service:
    url: ${OWNER_SERVICE_URL:}
  staff-service:
    url: ${STAFF_SERVICE_URL:}
  integration-service:
    url: ${INTEGRATION_SERVICE_URL:}
