server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # 로컬 실행 시 레포 루트의 infra/config-repo, Docker에서는 CONFIG_REPO_ROOT로 오버라이드
          search-locations: file:${CONFIG_REPO_ROOT:./infra/config-repo}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
